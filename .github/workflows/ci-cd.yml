name: CI/CD

# Tests run on every branch push and on PRs. Build + deploy happen only when
# code lands on `production` (i.e. a merge from development into production).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [development, production]

# One in-flight run per branch; cancel superseded runs to save minutes.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/sagarvincent/webscrapper
  NAMESPACE: webscrapper

jobs:
  # ---------------------------------------------------------------------------
  # CI: unit tests. Self-contained (no Postgres/Redis needed). Runs everywhere.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest test.unit.parserTest test.unit.HTMLFetcherTest

  # ---------------------------------------------------------------------------
  # Build the image and push to GHCR. Only on pushes to `production`, after
  # tests pass. Uses the built-in GITHUB_TOKEN — no extra secret to configure.
  # ---------------------------------------------------------------------------
  build:
    needs: test
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GitHub Container Registry
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Gate the deploy on the required secrets being present, so the pipeline stays
  # green before the server is wired up. The server is reached through a
  # Cloudflare Tunnel, so we authenticate to Cloudflare Access with a service
  # token and proxy SSH through `cloudflared`. Required repo secrets:
  #   SSH_HOST               — the Access-protected SSH hostname (e.g. ssh.example.com)
  #   SSH_USER               — Linux user on the server
  #   SSH_KEY                — private key (PEM) for that user
  #   CF_ACCESS_CLIENT_ID    — Access service token client id
  #   CF_ACCESS_CLIENT_SECRET— Access service token client secret
  # ---------------------------------------------------------------------------
  check-secrets:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      has-ssh: ${{ steps.check.outputs.has }}
    steps:
      - id: check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$CF_ID" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped — set SSH_HOST/SSH_USER/SSH_KEY and CF_ACCESS_CLIENT_ID/CF_ACCESS_CLIENT_SECRET to enable."
          fi

  # ---------------------------------------------------------------------------
  # Deploy: reach the server over the Cloudflare Tunnel (cloudflared ProxyCommand
  # + Access service token), apply the k8s/ manifests to its k3s cluster, pin
  # web + worker to the freshly built image (by SHA), and wait for the rollout.
  # The server pulls the image from GHCR.
  # ---------------------------------------------------------------------------
  deploy:
    needs: [build, check-secrets]
    if: needs.check-secrets.outputs.has-ssh == 'true'
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      # cloudflared reads these for headless (non-interactive) Access auth.
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          # Pin to a build that honours service tokens: 2026.6.0 regressed and
          # falls back to interactive browser auth (cloudflared issue #1673).
          # Bump this once the fix ships.
          VER=2026.5.1
          curl -fsSL -o cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${VER}/cloudflared-linux-amd64"
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Deploy to k3s over the tunnel
        run: |
          # Route SSH through the Cloudflare Tunnel. accept-new pins the host key
          # on first connect (there is no directly reachable host:22 to keyscan).
          SSH_OPTS=(
            -i ~/.ssh/id_deploy
            -o StrictHostKeyChecking=accept-new
            -o ProxyCommand="cloudflared access ssh --hostname %h"
          )

          scp "${SSH_OPTS[@]}" -r k8s "$SSH_USER@$SSH_HOST:/tmp/webscrapper-k8s"

          ssh "${SSH_OPTS[@]}" "$SSH_USER@$SSH_HOST" bash -s <<EOF
          set -euo pipefail
          kubectl get namespace "$NAMESPACE" >/dev/null 2>&1 || kubectl create namespace "$NAMESPACE"
          kubectl -n "$NAMESPACE" apply -f /tmp/webscrapper-k8s/
          kubectl -n "$NAMESPACE" set image deployment/web web=$IMAGE:$GITHUB_SHA
          kubectl -n "$NAMESPACE" set image deployment/worker worker=$IMAGE:$GITHUB_SHA
          kubectl -n "$NAMESPACE" rollout status deployment/web --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deployment/worker --timeout=180s
          EOF

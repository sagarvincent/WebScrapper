# Redis as the RQ broker. In-memory queue state only (jobs/results live in
# Postgres), so a single ephemeral replica is acceptable: a Redis restart at
# worst drops queued-but-unstarted jobs, which can be resubmitted. For
# stronger guarantees use a managed Redis or add persistence.
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5

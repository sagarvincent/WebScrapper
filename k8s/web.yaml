# Stateless web tier: scale freely. All state is in Postgres, so any replica
# can serve any request (create / poll / cancel / download) for any job.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate      # stateless tier rolls safely (no shared volume)
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: webscrapper:0.2     # set to <registry>/webscrapper:<tag> for cloud
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: webscrapper-config
          env:
            - name: PG_DSN
              valueFrom:
                secretKeyRef:
                  name: webscrapper-secret
                  key: PG_DSN
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  # annotations / ingressClassName are cluster-specific. Examples:
  #   ingressClassName: nginx            # nginx-ingress
  #   ingressClassName: traefik          # k3s/traefik
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
---
# CPU-based autoscaling for the web tier. Worker autoscaling on queue depth
# is a follow-up (needs KEDA's Redis scaler) — see README.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

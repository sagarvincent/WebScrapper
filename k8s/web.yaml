# Stateless web tier: scale freely. All state is in Postgres, so any replica
# can serve any request (create / poll / cancel / download) for any job.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate      # stateless tier rolls safely (no shared volume)
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/sagarvincent/webscrapper:0.2   # public GHCR package, no pull secret
          imagePullPolicy: Always
          ports:
            - containerPort: 22001
          envFrom:
            - configMapRef:
                name: webscrapper-config
          env:
            - name: PG_DSN
              valueFrom:
                secretKeyRef:
                  name: webscrapper-secret
                  key: PG_DSN
          readinessProbe:
            httpGet:
              path: /healthz
              port: 22001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 22001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 22001          # in-cluster Service port
      targetPort: 22001    # container port (gunicorn)
      nodePort: 22001      # exposed on every node's IP, within the allowed range
  # NodePort default range is 30000-32767. To use 22001 the API server needs:
  #   --service-node-port-range=22001-22999
  # k3s: add to /etc/systemd/system/k3s.service ExecStart as
  #   --kube-apiserver-arg=service-node-port-range=22001-22999  then restart k3s.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  # annotations / ingressClassName are cluster-specific. Examples:
  #   ingressClassName: nginx            # nginx-ingress
  #   ingressClassName: traefik          # k3s/traefik
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 22001
---
# CPU-based autoscaling for the web tier. Worker autoscaling on queue depth
# is a follow-up (needs KEDA's Redis scaler) — see README.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

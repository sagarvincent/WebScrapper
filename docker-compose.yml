# Local stand-in for the Kubernetes topology: Postgres + Redis + a stateless
# web tier + a scalable worker tier. Prove decoupling locally before K8s:
#
#   docker compose up --build           # web at http://localhost:22001
#   docker compose up --scale web=2 --scale worker=3
#
# Host-published ports live in the allowed 22001-22999 range. Inside the
# compose network the services still talk on their standard ports
# (postgres:5432, redis:6379) via service DNS.
#
# (A reverse proxy/LB in front of multiple web replicas is out of scope here;
#  scale workers freely, and scale web to confirm shared state via the DB.)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
      POSTGRES_DB: scraper
    ports:
      - "22432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "22379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    environment:
      PG_DSN: postgresql://scraper:scraper@postgres:5432/scraper
      REDIS_URL: redis://redis:6379/0
      PORT: "22001"
    ports:
      - "22001:22001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "worker.py"]
    environment:
      PG_DSN: postgresql://scraper:scraper@postgres:5432/scraper
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
